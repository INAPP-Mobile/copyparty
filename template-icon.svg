<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <g transform="translate(128,140)">
    <!-- open folder -->
    <path d="M-70 -18
             L-70 52 Q-70 60 -62 60
             L62 60 Q70 60 70 52
             L74 -14 Q74 -22 66 -22
             L-6 -22 L-20 -40 L-68 -40 Q-76 -40 -76 -32 Z"
          fill="url(#fold)"/>
    <!-- folder flap -->
    <path d="M-70 -18 L66 -18 L62 52 L-66 52 Z" fill="#EEF2FF" opacity="0.0"/>
    <!-- share / upload arrow -->
    <path d="M0 -52
             L34 -18
             L16 -18
             L16 26
             L-16 26
             L-16 -18
             L-34 -18 Z"
          fill="url(#up)"/>
    <circle cx="0" cy="-58" r="6" fill="#6EE7B7"/>
  </g>
</svg>
